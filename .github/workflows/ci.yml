name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (black · isort · flake8 · mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install black==23.12.1 isort==5.13.2 flake8==7.0.0 mypy==1.8.0 types-requests
      - run: black --check src tests
      - run: isort --check-only src tests
      - run: flake8 src tests
      - run: mypy src

  test:
    name: unit + spark integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4           # Spark runtime for integration tests
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Full requirements keeps parity with prod pins; airflow/dbt are heavy but cached
      - run: pip install -r requirements.txt
      - name: Run test suite
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: pytest tests/unit -v --cov=src --cov-report=term-missing
      - name: Enforce DAG static contract
        run: pytest tests/unit/test_dags.py -v   # AST layer always; DagBag layer skips w/o airflow

  terraform:
    name: terraform fmt · validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  dag-contract:
    name: airflow DAG integrity (with airflow installed)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Airflow only — enough for DagBag import checks without the full stack
      - run: |
          pip install "apache-airflow==2.8.0" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.8.0/constraints-3.11.txt"
      - run: pytest tests/unit/test_dags.py -v
